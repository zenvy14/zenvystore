<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zen Tree</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Montserrat", sans-serif;
    }

    body {
      background: #ffffff;
      color: #111;
    }
    
    header {
      padding: 25px;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #555;
      font-size: 16px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 30px;
      padding: 50px;
      max-width: 1200px;
      margin: auto;
      border-radius: 10px;
    }

    .product {
      text-align: center;
    }

    .product img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 10px;
      background: #f2f2f2;
    }

    .product h3 {
      margin-top: 15px;
      font-weight: 500;
    }

    .price {
      margin: 8px 0 15px;
      font-weight: 600;
    }

    .buy-btn {
      display: inline-block;
      padding: 12px 25px;
      background: black;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: 0.2s;
      font-size: 14px;
    }

    .buy-btn:hover {
      background: #333;
    }

    footer {
      text-align: center;
      padding: 40px;
      font-size: 14px;
      color: #777;
    }

    .sizes {
      font-size: 16px;
      color: red;
      margin-bottom: 15px;
            }  
</style>

  
</head>
