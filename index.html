<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenvy</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Montserrat", sans-serif;
    }

    body {
      background: #ffffff;
      color: #111;
    }

    header {
      padding: 25px;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #555;
      font-size: 16px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 30px;
      padding: 50px;
      max-width: 1200px;
      margin: auto;
    }

    .product {
      text-align: center;
    }

    .product img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 10px;
      background: #f2f2f2;
    }

    .product h3 {
      margin-top: 15px;
      font-weight: 500;
    }

    .price {
      margin: 8px 0 15px;
      font-weight: 600;
    }

    .buy-btn {
      display: inline-block;
      padding: 12px 25px;
      background: black;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: 0.2s;
      font-size: 14px;
    }

    .buy-btn:hover {
      background: #333;
    }

    footer {
      text-align: center;
      padding: 40px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

<header>ZENVY</header>

<section class="hero">
  <h1>Modern Essentials</h1>
  <p>Premium streetwear built for everyday comfort.</p>
</section>

<section class="products">

  <!-- Shirt 1 -->
  <div class="product">
    <img src="tshirt.png" alt="ECRA Classic Tee">
    <h3>ECRA Classic Tee</h3>
    <p class="price">$25</p>
    <a href="https://buy.stripe.com/4gM7sN5Qv8HZ6D71G30Ny00" class="buy-btn">Buy Now</a>
  </div>

  <!-- Shirt 2 -->
  <div class="product">
    <img src="shirtmin.png" alt="ECRA Minimal Tee">
    <h3>ECRA Minimal Tee</h3>
    <p class="price">$28</p>
    <a href="https://buy.stripe.com/14A8wRa6LbUb5z3esP0Ny01" class="buy-btn">Buy Now</a>
  </div>

  <!-- Sweatshirt 1 -->
  <div class="product">
    <img src="crewneck.png" alt="Zenvy Oversized Crew">
    <h3>ECRA Oversized Crew</h3>
    <p class="price">$55</p>
    <a href="https://buy.stripe.com/14A8wR92Hgar9PjgAX0Ny02" class="buy-btn">Buy Now</a>
  </div>

  <!-- Sweatshirt 2 -->
  <div class="product">
    <img src="hoodie.jpg" alt="Zenvy Heavy Hoodie">
    <h3>Zenvy Heavy Hoodie</h3>
    <p class="price">$52</p>
    <a href="YOUR_STRIPE_LINK_HERE" class="buy-btn">Buy Now</a>
  </div>

</section>

<footer>
  © 2026 Zenvy. All rights reserved.
</footer>

</body>
</html>
